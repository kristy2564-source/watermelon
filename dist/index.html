<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>合成大西瓜 · 网页小游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#F6F8EF; --bg2:#E7F0DD;
    --card:#FCFDF8;
    --ink:#3E4A36; --sub:#8A9A78; --body:#5E6B52;
    --sage:#7FA86B; --sage-d:#5E8A4E; --peach:#E7A17C; --terra:#C97A63;
    --green:#3FBF5B; --green-d:#2E9E47; --orange:#FF9F45; --danger:#E08A7A;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Noto Serif SC","Songti SC","SimSun",serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink); display:flex; justify-content:center; align-items:flex-start;
    padding:24px 16px 40px; min-height:100vh; overflow-x:hidden;
  }
  .app{width:100%; max-width:980px;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(252,253,248,.82); border:1.5px solid var(--sage);
    border-radius:18px; padding:14px 28px; margin-bottom:22px;
    box-shadow:0 6px 18px rgba(62,74,54,.12);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .top-actions{display:flex; align-items:center; gap:10px;}
  .brand .emoji{font-size:34px;}
  .brand h1{font-size:26px; font-weight:700; letter-spacing:1px;}
  .btn{
    border:1.5px solid var(--sage-d); cursor:pointer; font-family:inherit; font-weight:700; color:#fff;
    background:var(--sage); border-radius:999px; padding:11px 22px; font-size:15px;
    box-shadow:0 4px 12px rgba(94,138,78,.32); transition:transform .12s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.05);} .btn:active{transform:scale(.96);}
  .btn.ghost{background:var(--card); color:var(--ink); border:1.5px solid var(--sage); box-shadow:none;}
  main{display:flex; gap:34px; justify-content:center; align-items:flex-start; flex-wrap:wrap;}
  .stage-decor{position:relative; padding:72px 72px 82px;}
  .stage-frame{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:2; pointer-events:none;
    filter: drop-shadow(0 2px 4px rgba(62,74,54,.10));
  }
  .stage-wrap{
    position:relative; z-index:1; background:var(--card); border-radius:30px; padding:18px;
    box-shadow:0 12px 30px rgba(62,74,54,.14);
  }
  canvas{display:block; border-radius:20px; background:#F4F8EE; touch-action:none; cursor:pointer;}
  .panel{width:300px; display:flex; flex-direction:column; gap:14px;}
  .card{background:var(--card); border:1.5px solid rgba(127,168,107,.55); border-radius:18px; padding:16px 18px; box-shadow:0 8px 20px rgba(62,74,54,.10);}
  .card .lbl{font-size:13px; color:var(--sub); font-weight:600; letter-spacing:1px;}
  .score-num{font-family:"Noto Serif SC","Songti SC",serif; font-size:40px; font-weight:700; line-height:1.1; color:var(--ink);}
  .best-num{font-family:"Noto Serif SC","Songti SC",serif; font-size:30px; font-weight:700; color:var(--peach);}
  .next-row{display:flex; align-items:center; justify-content:space-between;}
  .next-row .name{font-size:15px; font-weight:700;}
  .next-box{width:48px; height:48px; position:relative;}
  .next-box canvas{width:100%; height:100%; display:block; border-radius:0; background:transparent;}
  .rules .rt{font-size:14px; font-weight:700; margin-bottom:8px;}
  .rules p{font-size:13px; color:var(--body); line-height:1.7; margin:2px 0;}
  .rules .hi{color:var(--danger); font-weight:700;}
  .panel .btn{width:100%; padding:14px; font-size:16px;}
  footer{
    margin-top:26px; background:var(--card); border-radius:24px; padding:22px 26px;
    box-shadow:0 8px 20px rgba(115,76,64,.10);
  }
  .footer-title{font-size:18px; font-weight:800; margin-bottom:4px;}
  .footer-sub{font-size:13px; color:var(--sub); margin-bottom:16px;}
  .chain{display:flex; align-items:center; flex-wrap:wrap; gap:6px 4px;}
  .unit{display:flex; flex-direction:column; align-items:center; gap:5px; width:62px;}
  .unit canvas{width:42px; height:42px; display:block;}
  .unit .nm{font-size:11px; color:var(--body); text-align:center; line-height:1.2;}
  .arrow{color:var(--sage-d); font-weight:700; font-size:16px; flex:0 0 auto;}
  .overlay{
    position:absolute; inset:18px; border-radius:20px; background:rgba(62,74,54,.86);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#F6F8EF; text-align:center; z-index:12;
  }
  .overlay.show{display:flex;}
  #lbOverlay{z-index:14;}
  .overlay h2{font-size:30px; font-weight:700; color:#F6F8EF; letter-spacing:2px;}
  .overlay .final{font-size:18px; opacity:.92;}
  .overlay .final b{font-size:30px; color:var(--peach);}
  .hint{font-size:12px; color:var(--sub); text-align:center; margin-top:8px;}

  /* ===== 穆夏风 · 初始引导弹窗 ===== */
  .start-overlay{
    position:absolute; inset:18px; border-radius:20px; z-index:13;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:28px;
    background:linear-gradient(160deg, rgba(246,248,239,.93), rgba(231,240,221,.93));
    backdrop-filter:blur(2px);
  }
  .start-overlay.show{display:flex;}
  .start-card{
    width:min(360px, 88%); background:var(--card);
    border:1.5px solid var(--sage); border-radius:24px; padding:30px 30px 26px;
    box-shadow:0 16px 40px rgba(62,74,54,.18);
    display:flex; flex-direction:column;  align-items:center; gap:14px; position:relative;
  }
  .start-flower{ width:86px; height:auto; margin-bottom:2px; }
  .start-card h2{font-size:28px; font-weight:700; letter-spacing:2px; color:var(--ink);}
  .start-sub{font-size:13px; color:var(--sub); letter-spacing:1px; margin-top:-6px;}
  .start-guide{
    font-size:13px; color:var(--body); line-height:1.95; text-align:left;
    background:rgba(127,168,107,.10); border-radius:14px; padding:12px 16px;
  }
  .start-guide .hi{color:var(--danger); font-weight:700;}
  .start-card .btn{margin-top:4px; font-size:17px; padding:13px 36px;}

  /* ===== 排行榜 ===== */
  .submit-row{display:flex; gap:8px; width:min(260px,80%);}
  .name-input{
    flex:1; min-width:0; font:inherit; font-size:14px; color:var(--ink);
    background:#fff; border:1.5px solid var(--sage); border-radius:12px;
    padding:10px 12px; outline:none; text-align:center;
  }
  .name-input:focus{border-color:var(--sage-d,#5E8A4E); box-shadow:0 0 0 3px rgba(127,168,107,.18);}
  .submit-row .btn{padding:10px 16px; font-size:14px;}
  .submit-row .btn:disabled{opacity:.55; cursor:default;}
  .submit-tip{font-size:12px; color:var(--sub); min-height:16px; margin-top:-6px;}
  .lb-card{
    width:min(320px,86%); max-height:82%; background:var(--card);
    border:1.5px solid var(--sage); border-radius:24px; padding:22px 20px 18px;
    box-shadow:0 16px 40px rgba(62,74,54,.18);
    display:flex; flex-direction:column; gap:12px; overflow:hidden;
  }
  .lb-list{flex:1; overflow:auto; display:flex; flex-direction:column; gap:6px; min-height:120px; padding:2px;}
  .lb-row{
    display:flex; align-items:center; gap:10px; font-size:14px; color:var(--body);
    background:rgba(127,168,107,.08); border-radius:12px; padding:8px 12px;
  }
  .lb-rank{width:24px; font-weight:700; color:var(--sage); text-align:center;}
  .lb-row.top1 .lb-rank{color:#C9962E;}
  .lb-row.top2 .lb-rank{color:#8C9BA8;}
  .lb-row.top3 .lb-rank{color:#B0764F;}
  .lb-row.me{outline:1.5px dashed var(--sage); background:rgba(127,168,107,.16);}
  .lb-my-sep{font-size:12px; color:var(--sub); text-align:center; padding:7px 0 1px; border-top:1px solid rgba(127,168,107,.28);}
  .lb-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lb-score{font-weight:700; color:var(--ink);}
  .lb-empty{font-size:13px; color:var(--sub); text-align:center; padding:26px 8px; line-height:1.8;}

  /* ===== 响应式：窄屏（手机）适配 ===== */
  @media (max-width:680px){
    body{padding:14px 10px 28px;}
    .app{max-width:100%;}
    header{padding:10px 16px; margin-bottom:14px; border-radius:14px;}
    header .btn{padding:9px 13px; font-size:13px;}
    .top-actions{gap:6px;}
    .brand{gap:8px;}
    .brand .emoji{font-size:26px;}
    .brand h1{font-size:20px;}
    .btn{padding:9px 16px; font-size:14px;}
    main{gap:16px;}
    .stage-decor{padding:32px 32px 38px;}
    .stage-wrap{padding:12px; border-radius:22px; margin:0 auto;}
    .panel{width:100%; max-width:440px; margin:0 auto;}
    .card{padding:13px 15px; border-radius:15px;}
    .score-num{font-size:34px;}
    .best-num{font-size:26px;}
    .panel .btn{padding:13px; font-size:15px;}
    footer{border-radius:18px; padding:16px 18px; margin-top:18px;}
    .footer-title{font-size:16px;}
    .unit{width:54px;}
    .unit canvas{width:38px; height:38px;}
    .unit .nm{font-size:10px;}
  }
  @media (max-width:380px){
    .brand h1{font-size:18px;}
    .unit{width:48px;}
    .unit canvas{width:34px; height:34px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="emoji">🍉</span><h1>合成大西瓜</h1></div>
    <div class="top-actions">
      <button class="btn ghost" id="lbBtn">🏆 排行榜</button>
      <button class="btn ghost" id="restartTop">重新开始</button>
    </div>
  </header>

  <main>
    <div class="stage-decor">
      <img class="stage-frame" src="assets/frame_ring_sage.svg" alt="" onerror="this.style.display='none'" />
      <div class="stage-wrap">
        <canvas id="game" width="440" height="600"></canvas>
        <div class="overlay" id="overlay">
          <h2>游戏结束</h2>
          <div class="final">本局得分 <b id="finalScore">0</b></div>
          <div class="submit-row">
            <input id="nameInput" class="name-input" maxlength="12" placeholder="输入昵称上榜">
            <button class="btn" id="submitScoreBtn">上传成绩</button>
          </div>
          <div class="submit-tip" id="submitTip"></div>
          <button class="btn" id="restartBtn">再来一局</button>
        </div>

        <div class="start-overlay show" id="startOverlay">
          <div class="start-card">
            <img class="start-flower" src="assets/flower_clematis.svg" alt="铁线莲装饰">
            <h2>合成大西瓜</h2>
            <div class="start-guide">
              • 移动鼠标 / 手指瞄准落点，点击放下水果<br>
              • 相同两个水果相撞，会合成更大的下一阶<br>
              • 一路合成到大西瓜即可封顶得分<br>
              <span class="hi">• 水果堆过顶部危险线即结束，挑战极限吧！</span>
            </div>
            <button class="btn" id="startBtn2">开始游戏</button>
          </div>
        </div>

        <div class="overlay" id="lbOverlay">
          <div class="lb-card">
            <h2 id="lbTitle">🏆 全服排行榜</h2>
            <div class="lb-list" id="lbList"><div class="lb-empty">加载中…</div></div>
            <button class="btn ghost" id="lbClose">关闭</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="card">
        <div class="lbl">当前分数</div>
        <div class="score-num" id="score">0</div>
      </div>
      <div class="card">
        <div class="lbl">最高分</div>
        <div class="best-num" id="best">0</div>
      </div>
      <div class="card next-row">
        <span class="name">下一颗</span>
        <div class="next-box"><canvas id="nextCv" width="96" height="96"></canvas></div>
      </div>
      <div class="card rules">
        <div class="rt">玩法说明</div>
        <p>• 移动鼠标 / 手指瞄准落点，点击放下水果</p>
        <p>• 相同的两个水果相撞会合成更大的水果</p>
        <p>• 水果堆到危险线以上即游戏结束</p>
        <p class="hi">• 合成大西瓜可得最高分！</p>
      </div>
      <button class="btn" id="startBtn">开始游戏</button>
      <div class="hint">提示：键盘 ← → 微调落点 · 水果落地后会沿斜堆缓缓滚下</div>
    </div>
  </main>

  <footer>
    <div class="footer-title">🍉 水果进化链路</div>
    <div class="footer-sub">相同水果相撞，合成更大的下一阶，分数越来越高</div>
    <div class="chain" id="chain"></div>
  </footer>
</div>

const FRUIT_VB = [
  {w:36,h:36,s:1.00}, // 樱桃
  {w:36,h:36,s:1.00}, // 草莓
  {w:36,h:36,s:1.00}, // 葡萄
  {w:36,h:36,s:1.00}, // 橘子
  {w:36,h:36,s:1.00}, // 柠檬
  {w:36,h:36,s:1.00}, // 青苹果
  {w:36,h:36,s:0.88}, // 桃子：本体偏大，视觉稍缩
  {w:36,h:36,s:1.10}, // 菠萝：本体只占 viewBox ~50% 宽，整体放大到 1.10 让本体贴近碰撞圆；皇冠外溢作装饰叶（类苹果叶），碰撞半径同步从 60→54 让皇冠不再喧宾夺主
  {w:36,h:36,s:1.00}, // 哈密瓜
  {w:36,h:25.22,s:1.00} // 西瓜是切片形，viewBox 高比是 25.22/36，不是正方
];
const FRUIT_IMG = [];

function loadFruitIcons(){
  return Promise.all(FRUIT_SVG.map((svg, i) => new Promise(res => {
    const blob = new Blob([svg], {type:'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { FRUIT_IMG[i] = img; URL.revokeObjectURL(url); res(); };
    img.onerror = () => { URL.revokeObjectURL(url); res(); };
    img.src = url;
  })));
}

/* 用 Twemoji 图标等比缩放渲染水果：图标宽度按各自系数缩到 2r*s，
   没有白色描边，相邻水果之间不再有白色缝隙。 */
function drawFruitShape(ctx, type, r){
  const img = FRUIT_IMG[type];
  if(!img) return;
  const vb = FRUIT_VB[type];
  const s = vb.s || 1;
  const w = 2*r * s;
  const h = w * vb.h / vb.w;
  ctx.drawImage(img, -w/2, -h/2, w, h);
}

loadFruitIcons().then(()=>{
  // 图标异步加载完成后，统一补绘链路画布（脚本启动时 paintFruitTo 同步执行，那时 FRUIT_IMG 是空的，大水果图标全部丢失）
  for(const it of chainCanvases){ paintFruitTo(it.cv, it.type); }
});

function paintFruitTo(cv, type){
  const c = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  c.clearRect(0,0,w,h);
  const r = Math.min(w,h)/2 - 2;
  c.save();
  c.translate(w/2, h/2);
  drawFruitShape(c, type, r);
  c.restore();
}

/* ===== 物理引擎 ===== */
const G=0.7, DAMP=0.998, SUBSTEPS=8, REST_GROUND=0.42, REST_BALL=0.4, GROUND_FRIC=0.9, BALL_FRIC=0.25;

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

/* 画布自适应：内部分辨率(W×H)固定，显示尺寸随屏幕宽度缩放，并按 DPR 渲染保证清晰 */
function setupCanvas(){
  const budget = window.innerWidth - 68;            // 减去 body 边距 + stage 内边距/边框
  const displayW = Math.max(240, Math.min(W, budget));
  const displayH = displayW * H / W;                // 锁定 440:600 比例
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width  = displayW + 'px';
  cv.style.height = displayH + 'px';
  cv.width  = Math.round(displayW * dpr);
  cv.height = Math.round(displayH * dpr);
  // 把逻辑坐标(W,H)映射到实际像素缓冲，物理与绘制无需改动
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  if(pending){ pending.x = Math.max(RADII[pending.type], Math.min(W - RADII[pending.type], pending.x)); }
}
/* setupCanvas() 的调用与监听已下移，避免提前访问 pending 触发 TDZ 报错 */

let fruits=[], pending=null, nextType=0, score=0, best=0, running=false, over=false,  overTimer=0, effects=[], lastDropTime=-9999;
const DROP_CD = 380; // 两次投放最小间隔(ms)，避免连点连发
setupCanvas();
window.addEventListener('resize', setupCanvas);
window.addEventListener('orientationchange', () => setTimeout(setupCanvas, 200));
const $score=document.getElementById('score'), $best=document.getElementById('best'),
      $overlay=document.getElementById('overlay'), $final=document.getElementById('finalScore'),
      $nextCv=document.getElementById('nextCv'), $startOverlay=document.getElementById('startOverlay');
try{ best=parseInt(localStorage.getItem('watermelon_best')||'0',10)||0; }catch(e){}
$best.textContent=best;

let lastAimX = null;   // 记住上次瞄准的 X，落子后新水果沿用，避免回中跳变
function weightedType(exclude){
  const pool=[0,0,0,0,1,1,1,2,2,3,4];
  if(exclude==null) return pool[Math.floor(Math.random()*pool.length)];
  // 防连抽：下一颗不与当前待落水果相同，避免连续两颗一样卡死
  let pick;
  do { pick = pool[Math.floor(Math.random()*pool.length)]; } while(pick===exclude);
  return pick;
}
function spawnPending(){
  nextType = nextType || weightedType();
  const t = nextType; nextType = weightedType(t);
  pending = {x: (lastAimX!=null ? Math.max(RADII[t], Math.min(W-RADII[t], lastAimX)) : W/2), type: t};
  paintFruitTo($nextCv, nextType);
}
function startGame(){
  fruits=[]; effects=[]; score=0; over=false; overTimer=0; submitted=false;
  $score.textContent="0"; $overlay.classList.remove('show');
  $startOverlay.classList.remove('show');
  $lbOverlay.classList.remove('show');
  spawnPending(); running=true;
}
function gameOver(){
  over=true; running=false;
  $final.textContent=score;
  $overlay.classList.add('show');
  submitted=false; $submitTip.textContent=""; $submitScoreBtn.disabled=false;
  $nameInput.value = localStorage.getItem('watermelon_name')||"";
  if(score>0) lbLocalAdd(($nameInput.value||"").trim()||"本机玩家", score); // 自动记入本机纪录榜
  if(score>best){ best=score; try{localStorage.setItem('watermelon_best',best);}catch(e){} $best.textContent=best; }
}
function dropPending(){
  if(!pending || over) return;
  const now = performance.now();
  if(now - lastDropTime < DROP_CD) return; // 冷却中，忽略这次投放，避免连点连发
  lastDropTime = now;
  const t = pending.type;
  fruits.push({x:pending.x, y:TOP_Y, r:RADII[t], type:t, vx:(Math.random()-0.5)*0.5, vy:1.5, merged:false});
  spawnPending();
}

function step(){
  if(!running) return;
  for(let s=0;s<SUBSTEPS;s++){
    for(const f of fruits){
      f.vy += G/SUBSTEPS;
      f.x  += f.vx/SUBSTEPS;
      f.y  += f.vy/SUBSTEPS;
    }
    for(const f of fruits){ f.vx *= DAMP; f.vy *= DAMP; }
    for(const f of fruits){
      if(f.y + f.r > H){ f.y = H - f.r; if(f.vy>0) f.vy = -f.vy * REST_GROUND; f.vx *= GROUND_FRIC; }
      if(f.x - f.r < 0){ f.x = f.r;     if(f.vx<0) f.vx = -f.vx * REST_GROUND; }
      if(f.x + f.r > W){ f.x = W - f.r; if(f.vx>0) f.vx = -f.vx * REST_GROUND; }
    }
    const merges=[];
    for(let i=0;i<fruits.length;i++){
      const a=fruits[i]; if(a.merged) continue;
      for(let j=i+1;j<fruits.length;j++){
        const b=fruits[j]; if(b.merged) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        const d = Math.hypot(dx,dy);
        const min = a.r + b.r;
        if(d>0 && d<min){
          const nx=dx/d, ny=dy/d;
          const overlap = min - d;
          const ma = a.r*a.r, mb = b.r*b.r, tot = ma+mb;
          a.x -= nx * overlap * (mb/tot);
          a.y -= ny * overlap * (mb/tot);
          b.x += nx * overlap * (ma/tot);
          b.y += ny * overlap * (ma/tot);
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vrel = rvx*nx + rvy*ny;
          if(vrel < 0){
            const j = -(1+REST_BALL)*vrel / (1/ma + 1/mb);
            const ix = j*nx, iy = j*ny;
            a.vx -= ix/ma; a.vy -= iy/ma;
            b.vx += ix/mb; b.vy += iy/mb;
            const tx=-ny, ty=nx;
            const vrelT = rvx*tx + rvy*ty;
            const jt = -vrelT * BALL_FRIC / (1/ma + 1/mb);
            a.vx -= jt*tx/ma; a.vy -= jt*ty/ma;
            b.vx += jt*tx/mb; b.vy += jt*ty/mb;
          }
          if(a.type===b.type){ merges.push([a,b]); }
        }
      }
    }
    if(merges.length){
      for(const [a,b] of merges){
        if(a.merged||b.merged) continue;
        a.merged = b.merged = true;
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        const nt = a.type+1;
        if(nt < RADII.length){
          fruits.push({x:mx, y:my, r:RADII[nt], type:nt, vx:(a.vx+b.vx)/4, vy:(a.vy+b.vy)/4, merged:false});
          const sc = SCORES[nt];
          score += sc; $score.textContent = score;
          effects.push({x:mx, y:my, r:RADII[nt]*0.55, alpha:1, txt:"+"+sc, color:"#C97A63"});
        }else{
          score += 100; $score.textContent = score;
          effects.push({x:mx, y:my, r:RADII[9]*0.7, alpha:1, txt:"+100", color:"#7FA86B"});
        }
      }
      fruits = fruits.filter(f=>!f.merged);
    }
  }

  let above=false;
  for(const f of fruits){ if(f.y - f.r < DANGER_Y) above=true; }
  if(above){ overTimer++; if(overTimer > 80) gameOver(); } else overTimer=0;

  for(const e of effects){ e.r += 3.0; e.alpha -= 0.03; }
  effects = effects.filter(e=>e.alpha>0);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  /* 危险线：清新珊瑚色，避免暖金压暗、不干扰落点判断 */
  ctx.save();
  ctx.strokeStyle="rgba(224,138,122,.6)"; ctx.lineWidth=1.5; ctx.setLineDash([7,6]);
  ctx.beginPath(); ctx.moveTo(8,DANGER_Y); ctx.lineTo(W-8,DANGER_Y); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle="#C97A63"; ctx.font="11px 'Noto Serif SC',serif"; ctx.textAlign="left";
  ctx.fillText("危险线 · 水果堆过此线即结束", 10, DANGER_Y-6);
  ctx.restore();

  for(const f of fruits){
    // 柔和投影：增强堆叠层次，让水果彼此分开
    const sg = ctx.createRadialGradient(f.x, f.y + f.r*0.5, f.r*0.2, f.x, f.y + f.r*0.5, f.r*1.05);
    sg.addColorStop(0, 'rgba(80,90,70,0.15)'); sg.addColorStop(1, 'rgba(80,90,70,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.ellipse(f.x, f.y + f.r*0.55, f.r*0.92, f.r*0.7, 0, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.translate(f.x, f.y); drawFruitShape(ctx, f.type, f.r); ctx.restore();
  }

  if(pending && !over){
    ctx.save();
    ctx.strokeStyle="rgba(127,168,107,.5)"; ctx.lineWidth=2; ctx.setLineDash([4,6]);
    ctx.beginPath(); ctx.moveTo(pending.x, TOP_Y + RADII[pending.type]); ctx.lineTo(pending.x, H-4); ctx.stroke();
    ctx.setLineDash([]);
    ctx.translate(pending.x, TOP_Y);
    drawFruitShape(ctx, pending.type, RADII[pending.type]);
    ctx.restore();
  }

  for(const e of effects){
    ctx.save(); ctx.globalAlpha = Math.max(0, e.alpha);
    ctx.strokeStyle = "#7FA86B"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = e.color || "#3E4A36"; ctx.font = "bold 16px 'Noto Serif SC',serif"; ctx.textAlign="center";
    ctx.fillText(e.txt, e.x, e.y - e.r - 6);
    ctx.restore();
  }
}

function pointerX(e){
  const r = cv.getBoundingClientRect();
  const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  const cx = (clientX - r.left) * (W / r.width);   // 显示像素 → 逻辑坐标 W
  return Math.max(RADII[0], Math.min(W-RADII[0], cx));
}
cv.addEventListener('pointermove', e=>{ if(pending && !over){ pending.x = pointerX(e); lastAimX = pending.x; } });
cv.addEventListener('pointerdown', e=>{
  // 落点即为"点击/落指处"：先用指针当前位置更新瞄准位，再落子，避免回中需二次移动
  if(running && !over && pending){ lastAimX = pending.x = pointerX(e); dropPending(); }
});
window.addEventListener('keydown', e=>{
  if(!pending || over) return;
  if(e.key==='ArrowLeft')  pending.x = Math.max(RADII[pending.type], pending.x-12);
  if(e.key==='ArrowRight') pending.x = Math.min(W-RADII[pending.type], pending.x+12);
  if(e.key===' ' || e.key==='Enter'){ if(running && !over) dropPending(); }
});

document.getElementById('startBtn').onclick    = ()=>{ if(!running) startGame(); };
document.getElementById('startBtn2').onclick   = ()=>{ if(!running) startGame(); };
document.getElementById('restartBtn').onclick  = startGame;
document.getElementById('restartTop').onclick= startGame;

/* ===== 云端排行榜（Supabase / PostgREST 兼容 REST）=====
 * 免费接入（Supabase 免费层：永久免费、无需信用卡、500MB 库 + API 请求不限量）：
 * 1. supabase.com 注册（GitHub 或邮箱登录，免绑卡）→ New project（区域选 Singapore 最近）
 * 2. 左侧「SQL Editor」执行下方建表 SQL
 * 3. Settings → API：把 Project URL 填入 LB_BASE（补 /rest/v1 后缀）、
 *    anon public key 填入 LB_KEY
 *
 * 注意：免费项目 7 天无访问会自动休眠（数据不丢，控制台一键 Restore）。
 *
 * 建表与权限 SQL（2026-05-30 后新项目必须显式 grant，否则 REST 读不到表）：
 *   create table score(
 *     id bigint generated by default as identity primary key,
 *     name text not null unique,
 *     score int not null default 0 check (score between 0 and 999999),
 *     created_at timestamptz default now());
 *   alter table score enable row level security;
 *   create policy "anon_ins" on score for insert to anon with check (true);
 *   create policy "anon_sel" on score for select to anon using (true);
 *   create policy "anon_upd" on score for update to anon using (true) with check (true);
 *   grant usage on schema public to anon;
 *   grant select, insert, update on table score to anon;
 */
const LB_BASE = "https://fmtdcxyldjogsvvkulur.supabase.co/rest/v1";
const LB_KEY  = "sb_publishable_ILvqXrO7r1Fr-4A5JtR-dA_mxGD-T73";  // Publishable key（可公开，配合 RLS，不是 secret/service_role）

const $lbOverlay=document.getElementById('lbOverlay'), $lbList=document.getElementById('lbList'),
      $nameInput=document.getElementById('nameInput'), $submitTip=document.getElementById('submitTip'),
      $submitScoreBtn=document.getElementById('submitScoreBtn'), $lbTitle=document.getElementById('lbTitle');
let submitted=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lbReady=()=>!!(LB_BASE&&LB_KEY);
const lbHeaders=()=>({'apikey':LB_KEY,'Content-Type':'application/json'});
const fetchT=(u,o={},ms=10000)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t));};

/* 本机纪录榜（云端不可达时的降级） */
const lbLocalGet=()=>{ try{ return JSON.parse(localStorage.getItem('watermelon_local_lb')||'[]'); }catch(e){ return []; } };
const lbLocalAdd=(name,score)=>{
  const merged=new Map();
  for(const item of lbLocalGet()){
    const old=merged.get(item.name);
    if(!old || Number(item.score)>Number(old.score)) merged.set(item.name,{name:item.name,score:Number(item.score)||0});
  }
  const old=merged.get(name);
  if(old) old.score=Math.max(old.score,score);
  else merged.set(name,{name:name,score:score});
  const a=[...merged.values()];
  a.sort((x,y)=>y.score-x.score);
  try{ localStorage.setItem('watermelon_local_lb',JSON.stringify(a.slice(0,10))); }catch(e){}
  return merged.get(name).score;
};
const lbLastGet=()=>{ try{ return JSON.parse(localStorage.getItem('watermelon_last_lb')||'null'); }catch(e){ return null; } };
const lbLastSet=item=>{ try{ localStorage.setItem('watermelon_last_lb',JSON.stringify(item)); }catch(e){} };
const lbRowHtml=(it,rank,isMe=false)=>
  '<div class="lb-row'+(rank<=3?' top'+rank:'')+(isMe?' me':'')+'"><span class="lb-rank">'+rank+'</span>'+
  '<span class="lb-name">'+esc(it.name||'神秘玩家')+'</span>'+
  '<span class="lb-score">'+it.score+'</span></div>';
const rowsHtml=(items,my=null)=>items.map(it=>{
  const rank=1+items.filter(x=>Number(x.score)>Number(it.score)).length;
  const isMe=!!my && it.name===my.name && Number(it.score)===Number(my.score);
  return lbRowHtml(it,rank,isMe);
}).join('');
const myCloudRankHtml=async(my,items)=>{
  if(!my || my.source==='local' || items.some(it=>it.name===my.name && Number(it.score)===Number(my.score))) return '';
  try{
    const rank=await lbRank(my.score);
    return '<div class="lb-my-sep">我的排名</div>'+lbRowHtml(my,rank,true);
  }catch(e){
    return '<div class="lb-my-sep">我的排名暂时无法获取</div>';
  }
};
const lbErr=e=>{ // 把云端失败原因翻译成人话，便于远程排查
  if(e&&e.name==='AbortError') return '连接超时（代理未覆盖或网络阻断）';
  const m=(e&&e.message)||'';
  if(m.indexOf('404')>=0)  return '数据表不存在（建表 SQL 未执行）';
  if(m.indexOf('401')>=0||m.indexOf('403')>=0) return '密钥或权限异常';
  if(m.indexOf('Failed to fetch')>=0) return '网络连接被阻断';
  return '服务异常('+(m||'未知')+')';
};

async function lbSubmit(name,score){
  const body={name:String(name).slice(0,12),score:Math.max(0,Math.min(999999,Math.floor(score)))};
  const find=await fetchT(LB_BASE+'/score?select=id,name,score&name=eq.'+encodeURIComponent(body.name)+'&limit=1',{headers:lbHeaders()});
  if(!find.ok) throw new Error('http '+find.status);
  const existing=(await find.json())[0];
  if(existing && Number(existing.score)>=body.score){
    return {score:Number(existing.score),improved:false};
  }
  if(existing){
    const res=await fetchT(LB_BASE+'/score?id=eq.'+encodeURIComponent(existing.id),{method:'PATCH',headers:{...lbHeaders(),'Prefer':'return=minimal'},body:JSON.stringify({score:body.score})});
    if(!res.ok) throw new Error('http '+res.status);
    return {score:body.score,improved:true};
  }
  const res=await fetchT(LB_BASE+'/score',{method:'POST',headers:{...lbHeaders(),'Prefer':'return=minimal'},body:JSON.stringify(body)});
  if(!res.ok) throw new Error('http '+res.status);
  return {score:body.score,improved:true};
}
async function lbRank(score){ // 我的全服名次 = 比我分高的人数 + 1
  const res=await fetchT(LB_BASE+'/score?select=score&score=gt.'+score,{headers:lbHeaders()});
  if(!res.ok) throw new Error('http '+res.status);
  const d=await res.json(); return d.length+1;
}
async function openLb(){
  $lbOverlay.classList.add('show');
  const local=lbLocalGet();
  const my=lbLastGet();
  if(!lbReady()){
    $lbTitle.textContent="📱 本机纪录榜";
    $lbList.innerHTML='<div class="lb-empty">云端排行榜配置中<br>当前为本机纪录模式</div>'+
      (local.length?rowsHtml(local,my&&my.source==='local'?my:null):'<div class="lb-empty">本机还没有纪录<br>先玩一局吧！</div>');
    return;
  }
  $lbTitle.textContent="🏆 全服排行榜";
  $lbList.innerHTML='<div class="lb-empty">加载中…</div>';
  try{
    const res=await fetchT(LB_BASE+'/score?select=name,score&order=score.desc&limit=10',{headers:lbHeaders()});
    if(!res.ok) throw new Error('http '+res.status);
    const data=await res.json();
    const topHtml=data.length?rowsHtml(data,my):'<div class="lb-empty">还没有人上榜<br>快来抢第一吧！</div>';
    $lbList.innerHTML=topHtml+await myCloudRankHtml(my,data);
  }catch(e){ // 云端不可达 → 降级本机榜
    $lbTitle.textContent="📱 本机纪录榜";
    $lbList.innerHTML=(local.length?rowsHtml(local,my&&my.source==='local'?my:null):'<div class="lb-empty">本机还没有纪录<br>先玩一局吧！</div>')+
      '<div class="lb-empty">（云端不可用：'+lbErr(e)+'，显示本机纪录）</div>';
  }
}
async function onSubmitScore(){
  if(submitted||!over) return;
  const name=($nameInput.value||"").trim().slice(0,12)||"神秘玩家";
  try{ localStorage.setItem('watermelon_name',name); }catch(e){}
  if(!lbReady()){ $submitTip.textContent="排行榜服务尚未配置，暂无法上传"; return; }
  submitted=true; $submitScoreBtn.disabled=true; $submitTip.textContent="上传中…";
  try{
    const result=await lbSubmit(name,score);
    lbLastSet({name:name,score:result.score,source:'cloud'});
    let rankTxt="已记录";
    try{ rankTxt="全服第 "+(await lbRank(result.score))+" 名"; }catch(e){}
    $submitTip.textContent=(result.improved?"最高分已更新！":"已有更高或相同成绩，保留原记录。")+rankTxt;
    openLb();
  }catch(e){
    const localScore=lbLocalAdd(name,score); // 云端不可达 → 记入本机纪录
    lbLastSet({name:name,score:localScore,source:'local'});
    submitted=false; $submitScoreBtn.disabled=false;
    $submitTip.textContent="云端暂不可达（"+lbErr(e)+"），已记入本机榜单";
  }
}
document.getElementById('lbBtn').onclick          = openLb;
document.getElementById('lbClose').onclick        = ()=> $lbOverlay.classList.remove('show');
$submitScoreBtn.onclick                           = onSubmitScore;

const chain = document.getElementById('chain');
const chainCanvases = []; // 收集所有链路画布，等 Twemoji 异步加载完后统一补绘
NAMES.forEach((nm,i)=>{
  const u = document.createElement('div'); u.className='unit';
  const c = document.createElement('canvas'); c.width=84; c.height=84;
  chainCanvases.push({cv:c, type:i});
  paintFruitTo(c, i);
  const lab = document.createElement('div'); lab.className='nm';
  lab.innerHTML = nm+"<br>"+SCORES[i];
  u.appendChild(c); u.appendChild(lab);
  chain.appendChild(u);
  if(i<NAMES.length-1){ const a=document.createElement('div'); a.className='arrow'; a.textContent='→'; chain.appendChild(a); }
});

function loop(){ step(); draw(); requestAnimationFrame(loop); }
loop();
